[project]
name = "governai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "fairlearn>=0.15.0",
    "faker>=40.43.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "streamlit>=1.66.1",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[project.scripts]
governai = "governai:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
